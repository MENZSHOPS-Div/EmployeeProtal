<style>
:root{--navy:#0c3a57;--blue:#17a58c;--lt:#e6f0f3;--bg:#f0f4f6;--bgi:linear-gradient(#f0f4f6,#f0f4f6);--card:#fff;--tx:#14303f;--mu:#566f7d;--bd:#c5d3db;--ok:#16a34a;--okb:#dcfce7;--wn:#b45309;--wnb:#fef3c7;--er:#dc2626;--erb:#fee2e2;--inf:#0b5d8a;--infb:#dcecf5;--gy:#475569;--gyb:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bgi:linear-gradient(#06191f,#06191f);--lt:#0f3b4d;--bg:#06191f;--card:#0c2530;--tx:#e2f3f7;--mu:#8db0bb;--bd:#1b3d4b;--okb:#12391f;--wnb:#3b2d0c;--erb:#3d1717;--infb:#0f3a52;--gyb:#27344a;--ok:#4ade80;--wn:#fbbf24;--er:#f87171;--inf:#93c5fd;--gy:#cbd5e1}}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Kanit,Sarabun,sans-serif;background:var(--bgi) fixed;background-color:var(--bg);color:var(--tx);font-size:15px;font-weight:300}
h1,h2,h3,h4{margin:0;font-weight:500}
#app{display:flex;min-height:100vh}
#side{width:250px;background:var(--navy);color:#d3e3ec;position:fixed;top:env(safe-area-inset-top,0px);bottom:0;left:0;overflow:auto;z-index:30;transition:transform .2s}
#side .brand{padding:18px 20px;font-size:18px;font-weight:500;color:#fff;display:flex;gap:10px;align-items:center}
#side .brand i{background:var(--blue);border-radius:0;width:34px;height:34px;display:grid;place-items:center;font-style:normal}
#side .grp{padding:14px 20px 6px;font-size:12px;letter-spacing:.06em;color:#8fb2c5}
#side a{display:flex;gap:10px;padding:10px 20px;color:#d3e3ec;text-decoration:none;cursor:pointer;border-left:3px solid transparent}
#side a:hover{background:rgba(255,255,255,.07)}#side a.on{background:rgba(255,255,255,.12);border-left-color:var(--blue);color:#fff;font-weight:500}
#wrap{margin-left:250px;flex:1;min-width:0}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:3px solid var(--blue);display:flex;align-items:center;gap:12px;padding:10px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:25}
#top .ham{display:none}
#main{padding:24px}
.btn{border:0;letter-spacing:.01em;border-radius:0;padding:8px 14px;font:inherit;font-weight:400;cursor:pointer;background:var(--gyb);color:var(--tx)}
.btn.p{background:var(--blue);color:#fff}.btn.n{background:var(--navy);color:#fff}.btn.s{background:#12a37f;color:#fff}.btn.d{background:var(--er);color:#fff}.btn.w{background:#f59e0b;color:#fff}.btn.sm{padding:4px 9px;font-size:13px}
.btn:focus-visible,.in:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--navy);border-radius:0;padding:18px;margin-bottom:18px;box-shadow:0 1px 3px rgba(12,58,87,.14)}.card>h4:first-child{padding-bottom:9px;border-bottom:1px solid var(--bd);text-transform:none}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.ph p{margin:2px 0 0;color:var(--mu)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.stat{display:flex;gap:14px;align-items:center}.stat .ic{width:46px;height:46px;border-radius:0;background:var(--lt);display:grid;place-items:center;font-size:22px}
.stat b{font-size:24px;font-weight:500;display:block}.stat span{color:var(--mu);font-size:13px}
.in{width:100%;border:1px solid #9fb3bf;background:var(--card);color:var(--tx);border-radius:0;padding:8px 11px;font:inherit}
.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.tools .in{width:auto;flex:1;min-width:150px;max-width:280px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--navy);color:#fff;font-weight:500;font-size:13px;cursor:pointer;user-select:none}tr:hover td{background:var(--lt)}
.bd{display:inline-block;padding:2px 10px;border-radius:0;font-size:12.5px;font-weight:400}
.ok{background:var(--okb);color:var(--ok)}.bd.ok::before{content:"✓ "}.wn{background:var(--wnb);color:var(--wn)}.er{background:var(--erb);color:var(--er)}.inf{background:var(--infb);color:var(--inf)}.gy{background:var(--gyb);color:var(--gy)}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mu);font-size:13px;flex-wrap:wrap;gap:8px}
.empty{text-align:center;padding:36px 10px;color:var(--mu)}.empty b{display:block;font-size:34px}
.av{width:34px;height:34px;border-radius:0;display:inline-grid;place-items:center;color:#fff;font-weight:500;font-size:13px;vertical-align:middle;margin-right:8px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.fg label{font-size:13px;color:var(--mu);display:block;margin-bottom:3px}.fg .w2{grid-column:1/-1}
.ov{position:fixed;inset:0;background:rgba(8,20,45,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.mo{background:var(--card);border-radius:0;width:100%;max-width:760px;max-height:90vh;overflow:auto}.mo h3{padding:16px 20px;border-bottom:1px solid var(--bd)}.mo .bo{padding:20px}.mo .ft{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:11px 18px;border-radius:0;z-index:99;display:none}
.bars{display:flex;gap:10px;align-items:flex-end;height:170px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mu)}.bars i{display:block;background:linear-gradient(var(--blue),var(--navy));border-radius:0;margin-bottom:4px}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--bd)}.row.t{font-weight:500;border-bottom:0;border-top:2px solid var(--navy);margin-top:6px}
.tag{display:inline-block;background:var(--lt);padding:4px 12px;border-radius:0;margin:3px;font-size:13px}
.idc{width:260px;border-radius:0;overflow:hidden;background:#fff;color:#1b2a41;box-shadow:0 1px 3px rgba(12,58,87,.14);text-align:center}
.idc .h{background:var(--navy);color:#fff;padding:14px;font-weight:500}.idc .ph2{width:100px;height:120px;margin:18px auto 10px;border-radius:0;background:#2f7a9a;color:#fff;display:grid;place-items:center;font-size:40px}
.paper{background:#fff;color:#111;padding:36px;border:1px solid var(--bd);border-radius:0;line-height:1.9;max-width:700px}
#login{position:fixed;inset:0;z-index:80;background:linear-gradient(135deg,#082a40,#0c3a57 60%,#0f5a73);display:grid;place-items:center;padding:16px}
#login .box{border-top:4px solid var(--blue);background:var(--card);border-radius:0;padding:34px;width:100%;max-width:400px;box-shadow:0 1px 3px rgba(12,58,87,.14)}
@media(max-width:900px){#side{transform:translateX(-100%)}#side.open{transform:none}#wrap{margin-left:0}#top .ham{display:block}#main{padding:14px}}
@media print{#side,#top,.ph,.noprint,body::before{display:none!important}#wrap{margin:0}.paper,.card{border:0}body.pm #app,body.pm .mo h3,body.pm .mo .ft{display:none!important}body.pm .ov{position:static;background:none;padding:0;display:block}body.pm .mo{max-height:none;max-width:none;box-shadow:0 1px 3px rgba(12,58,87,.14)}}
#bz{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),#5fd3d0);z-index:200;display:none}.idn{width:340px;max-width:100%;margin:0 auto;background:#fff;color:#17303a;border-radius:24px;overflow:hidden;box-shadow:0 8px 28px rgba(12,58,87,.25);text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.idn-h{background:linear-gradient(135deg,#0b7f78,#2fbfae);height:128px;padding:18px 18px 0;display:flex;justify-content:space-between;align-items:flex-start;color:#fff;text-align:left}
.idn-b{display:flex;gap:10px;align-items:center}.idn-b b{display:block;font-size:16px;font-weight:500}.idn-b small{display:block;font-size:10px;letter-spacing:.12em;opacity:.9}
.idn-lg{width:46px;height:46px;border-radius:12px;background:#fff;padding:3px;overflow:hidden;display:block;flex:none}
.idn-t{border:1px solid rgba(255,255,255,.7);border-radius:99px;padding:3px 12px;font-size:11px;letter-spacing:.12em}
.idn-p{width:104px;height:104px;border-radius:26px;border:4px solid #fff;background:#2f7a9a;margin:-62px auto 10px;overflow:hidden;display:grid;place-items:center;color:#fff;font-size:42px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.idn-p{position:relative}.idn-p img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.idn-n{font-size:20px;font-weight:500;padding:0 14px}
.idn-c{margin:12px 0}.idn-c span{display:inline-block;background:#dff2ef;color:#0b6a64;padding:6px 18px;border-radius:99px;font-size:14px}
.idn-i{margin:0 18px;background:#f2f8f8;border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;text-align:left}.idn-i small{display:block;font-size:11px;color:#6b8791}.idn-i b{font-weight:500;font-size:14px}.idn-i .w{grid-column:1/-1}
.idn-f{display:flex;flex-direction:column;align-items:flex-start;padding:16px 22px 18px}.idn-f small{font-size:10px;letter-spacing:.2em;color:#4b6670;margin-top:3px}
.idn-bar{height:6px;background:linear-gradient(90deg,#17a58c,#3b8fe0)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}.spin.d{border-color:rgba(12,58,87,.25);border-top-color:var(--navy)}@keyframes sp{to{transform:rotate(360deg)}}#lb:disabled{opacity:.85;cursor:wait}
